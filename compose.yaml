# BitChord Telegram Addon — compose (PRD §4.12)
# TLS is terminated by a reverse proxy in front of this service.
services:
  addon:
    build: .
    restart: unless-stopped
    mem_limit: 192m # planning limit; tighten toward 128m only if the M0 soak allows
    memswap_limit: 384m
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=72 --max-semi-space-size=2 --optimize-for-size --heapsnapshot-signal=SIGUSR2"
      UV_THREADPOOL_SIZE: "2"
      MALLOC_ARENA_MAX: "2"
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    volumes: ["./data:/data"]
    # The reverse proxy (Caddy/Nginx) targets this port; only expose publicly via the proxy.
    # ports: ["127.0.0.1:8080:8080"]
