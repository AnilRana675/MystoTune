name: release

# Release automation (repo ops): every push to main installs, typechecks, and
# test-gates; a push that bumps the version in package.json to one without a
# v<version> tag gets that tag + a GitHub Release whose notes are composed by
# scripts/release-notes.mjs (README roadmap highlight + commit list + diff
# link). An existing release's notes get refreshed on later pushes, so the
# page stays current. Render deploys stay independent (autoDeploy:false).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit-range notes
          fetch-tags: true # checkout@v4 does NOT fetch tags by default; the
                           # release composer needs previous v* tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the runtime image (node:22-slim)
          cache: npm

      - name: Install, typecheck, test (release gate)
        run: |
          npm ci
          npx tsc -p .
          npm test

      - name: Detect a new package.json version
        id: version
        run: |
          V="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "v=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose notes, then publish or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          PREV="$(git tag --list 'v*' --sort=-creatordate | grep -vx "v$VERSION" | head -1 || true)"
          echo "previous tag: ${PREV:-none}"
          node scripts/release-notes.mjs --version "$VERSION" --prev "$PREV" \
            --repo "${{ github.repository }}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            # tag already out — refresh its notes (keeps the page current)
            gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" || true
          else
            git config user.name "mystotune-release-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
            gh release create "v$VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --title "BitChord Telegram Addon v$VERSION"
          fi
